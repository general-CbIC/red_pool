name: Build and tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
    steps:
      - uses: actions/checkout@v6
      - uses: vishnudxb/redis-cluster@1.10.0
        with:
          master1-port: 7010
          master2-port: 7011
          master3-port: 7012
          slave1-port: 7013
          slave2-port: 7014
          slave3-port: 7015
          sleep-duration: 5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Fetch dependencies
        run: mix deps.get --only test
      - name: Launch tests
        run: mix test
  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
      - uses: actions/checkout@v6
      - uses: vishnudxb/redis-cluster@1.10.0
        with:
          master1-port: 7010
          master2-port: 7011
          master3-port: 7012
          slave1-port: 7013
          slave2-port: 7014
          slave3-port: 7015
          sleep-duration: 5
      - name: Set mix.lock file hash
        run: |
          mix_hash="${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}"
          echo "mix_hash=$mix_hash" >> $GITHUB_ENV
      - name: Cache PLT files
        uses: actions/cache@v5
        with:
          path: |
            _build/dev/*.plt
            _build/dev/*.plt.hash
          key: plt-cache-${{ env.mix_hash }}
          restore-keys: |
            plt-cache-
      - name: Run dialyzer
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix do deps.get + compile
      - run: mix check
